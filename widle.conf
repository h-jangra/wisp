# widle.conf - WIDLE Desktop Widget Configuration
# Syntax: key = value, [widget] sections for each widget

# Global settings
scale = 1
font = /usr/share/fonts/noto/NotoSans-Regular.ttf
font_size = 14

# Native status panel (with SVG icon)
[widget]
type = native
name = panel
image = assets/widle.svg
width = 240
height = 90
visible = true
anchor = top-right
margin = 8, 8, 0, 0

# Clock widget (Lua)
[widget]
type = lua
path = scripts/clock.lua
visible = true
anchor = top-right
margin = 106, 8, 0, 0

# System resource monitor (Lua)
[widget]
type = lua
path = scripts/sysmon.lua
visible = true
anchor = top-right
margin = 170, 8, 0, 0

# Power / battery monitor (Lua)
[widget]
type = lua
path = scripts/battery.lua
visible = true
anchor = top-right
margin = 248, 8, 0, 0
